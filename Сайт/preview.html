<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Важный вопрос ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background: linear-gradient(rgba(255,255,255,0.15), rgba(255,255,255,0.15)), url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=1920');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    display:flex;
    justify-content:center;
    padding:30px 0;
    min-height:100vh;
    overflow-y:auto;
}

.card{
    background:white;
    padding:25px;
    border-radius:25px;
    text-align:center;
    width:350px;
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    position:relative;
}

img{
    width:100%;
    border-radius:20px;
    object-fit:cover;
}

h1{ font-size:24px; margin:20px 0; }

.buttons{
    position:relative;
    height:120px;
}

button{
    border:none;
    padding:15px 25px;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
    transition:0.2s;
}

#yesBtn{ background:#ff5f95; color:white; }
#noBtn{ background:#ddd; position:absolute; left:200px; }

#choices{ display:none; }

.choice-btn{
    display:block;
    width:100%;
    margin:10px 0;
}

#customPlace{
    display:none;
    margin-top:10px;
}

input{
    padding:10px;
    width:90%;
    border-radius:10px;
    border:1px solid #ccc;
}

.error{
    color:red;
    margin-top:10px;
}
</style>
</head>
<body>

<div class="card" id="mainCard">
<img src="photo.jpg" alt="photo">

<h1>Пойдёшь со мной на прогулку? ❤️</h1>

<div class="buttons">
<button id="yesBtn">Да ❤️</button>
<button id="noBtn">Нет 😅</button>
</div>

<p id="phoneMessage" class="error"></p>

<div id="choices">
<h2>Куда хочешь пойти? 😌</h2>

<button class="choice-btn" onclick="sendChoice('🎮 Игратека')">🎮 Игратека</button>
<button class="choice-btn" onclick="sendChoice('🌳 Парк')">🌳 Парк</button>
<button class="choice-btn" onclick="showCustom()">✍️ Свой выбор</button>

<div id="customPlace">
<input id="placeInput" placeholder="Куда бы ты хотела?">
<button onclick="sendCustom()">Отправить</button>
</div>
</div>
</div>

<script>
const token = "8731976904:AAH-AXYW3MMzr5PyRCuKvw3MGXcI1tnrDGM";
const chatId = "1041440433";

const noBtn = document.getElementById("noBtn");

function isMobile(){
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

noBtn.addEventListener("mouseover", () => {
    if(!isMobile()){
        const x = Math.random() * 220;
        const y = Math.random() * 80;
        noBtn.style.left = `${x}px`;
        noBtn.style.top = `${y}px`;
    }
});

noBtn.addEventListener("click", () => {
    if(isMobile()){
        noBtn.style.display = "none";
        document.getElementById("phoneMessage").innerText =
        "Упс, ошибка 😅 Попробуй нажать на Да";
    }
});

document.getElementById("yesBtn").addEventListener("click", () => {

    if(navigator.vibrate){
        navigator.vibrate([300,100,300]);
    }

    sendToTelegram("❤️ Нажала ДА");

    document.querySelector(".buttons").style.display = "none";

    confetti({
        particleCount: 150,
        spread: 120,
        origin: { y: 0.6 }
    });

    setTimeout(() => {
        confetti({
            particleCount: 100,
            angle: 60,
            spread: 80,
            origin: { x: 0 }
        });

        confetti({
            particleCount: 100,
            angle: 120,
            spread: 80,
            origin: { x: 1 }
        });
    }, 400);

    for(let i = 0; i < 30; i++){
        let el = document.createElement("div");

        el.innerHTML = Math.random() > 0.5 ? "❤️" : "🌹";
        el.style.position = "fixed";
        el.style.left = Math.random() * 100 + "vw";
        el.style.top = "100vh";
        el.style.fontSize = (20 + Math.random() * 25) + "px";
        el.style.zIndex = "9999";
        el.style.transition = "transform 4s linear, opacity 4s";

        document.body.appendChild(el);

        setTimeout(() => {
            el.style.transform =
                `translateY(-120vh) rotate(${Math.random()*360}deg)`;
            el.style.opacity = "0";
        }, 50);

        setTimeout(() => el.remove(), 4000);
    }

    setTimeout(() => {
        document.getElementById("choices").style.display = "block";
    }, 2000);
});

function showCustom(){
    document.getElementById("customPlace").style.display = "block";
}

async function sendChoice(choice){
    await sendToTelegram(choice);
    alert("Ура ❤️ Тогда договорились!");
}

async function sendCustom(){
    const place = document.getElementById("placeInput").value;

    if(!place){
        alert("Напиши место 😊");
        return;
    }

    await sendToTelegram("✍️ Свой выбор: " + place);
    alert("Ура ❤️ Тогда договорились!");
}

async function sendToTelegram(message){
    fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            chat_id:chatId,
            text:"Она выбрала: " + message
        })
    });
}
</script>

</body>
</html>
